name: Build installers

# Push a tag like v0.1.0 to build the Mac and Windows installers and publish
# them as a GitHub release. "Run workflow" builds them without releasing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        run: npx electron-builder --publish never
        env:
          # Optional code signing. Leave these secrets unset to build unsigned installers.
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERTIFICATE_P12_BASE64 || secrets.WIN_CERTIFICATE_PFX_BASE64 }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERTIFICATE_PASSWORD || secrets.WIN_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: sidebar-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Sidebar ${{ github.ref_name }}
          files: installers/*
          body: |
            ## Download Sidebar

            | Computer | File |
            | --- | --- |
            | Mac with Apple chip (M1 or newer) | `Sidebar-${{ github.ref_name }}-arm64.dmg` |
            | Mac with Intel chip | `Sidebar-${{ github.ref_name }}-x64.dmg` |
            | Windows | `Sidebar-Setup-${{ github.ref_name }}.exe` |

            Not sure which Mac you have? Apple menu → About This Mac: it shows either "Chip: Apple M…" or "Processor: Intel…".

            These builds aren't code-signed yet. **Mac:** right-click Sidebar in Applications → Open (or System Settings → Privacy & Security → Open Anyway). **Windows:** if SmartScreen appears, click More info → Run anyway.
