name: Build installers

# Every push builds the Mac and Windows installers. When main has a
# package.json version that hasn't been released yet, they're published as
# release v<version>, so bumping the version is all it takes to ship.
on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  workflow_dispatch:

# Read-only by default. Only the release job (which runs no npm code) can
# write, so a compromised dependency during `npm ci` can't publish a release.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        shell: bash
        run: |
          # An empty CSC_LINK is read as a file path, so drop unset signing secrets.
          extra=""
          if [ "$RUNNER_OS" = "macOS" ]; then
            export CSC_LINK="$MAC_CSC_LINK" CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
          else
            export CSC_LINK="$WIN_CSC_LINK" CSC_KEY_PASSWORD="$WIN_CSC_KEY_PASSWORD"
          fi
          unset MAC_CSC_LINK MAC_CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            # Without a certificate, sign ad-hoc. A completely unsigned app is
            # reported as "damaged" on Apple-chip Macs and can't be opened.
            if [ "$RUNNER_OS" = "macOS" ]; then extra="-c.mac.identity=-"; fi
          fi
          if [ -z "$APPLE_ID" ]; then unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; fi
          npx electron-builder --publish never $extra
        env:
          # Optional code signing. Leave these secrets unset to build unsigned
          # installers. Each platform only ever sees its own certificate.
          MAC_CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CERTIFICATE_PFX_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Check the Windows update manifest was built
        if: runner.os == 'Windows'
        shell: bash
        run: test -f dist/latest.yml && cat dist/latest.yml
      - name: Verify the Mac app's signature
        if: runner.os == 'macOS'
        run: |
          for app in dist/mac*/Sidebar.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -E "Signature|Identifier|Format"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: sidebar-${{ runner.os }}
          # latest.yml and the .blockmap files let installed copies update themselves.
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  release:
    # Installed copies auto-update from the latest release, so only ever
    # publish what has been merged into main.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check whether this version is already released
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Published releases only (a draft left by a failed upload gets finished).
          # Any error other than "not found" stops the job rather than re-publishing.
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .id > /dev/null 2> err.txt; then
            echo "Release $tag already exists; bump the version in package.json to publish a new one."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif grep -q "HTTP 404" err.txt; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            cat err.txt
            exit 1
          fi
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.publish == 'true'
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        if: steps.version.outputs.publish == 'true'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Sidebar ${{ steps.version.outputs.tag }}
          make_latest: true
          files: installers/*
          body: |
            ## Download Sidebar

            | Computer | File |
            | --- | --- |
            | Mac with Apple chip (M1 or newer) | `Sidebar-${{ steps.version.outputs.tag }}-arm64.dmg` |
            | Mac with Intel chip | `Sidebar-${{ steps.version.outputs.tag }}-x64.dmg` |
            | Windows | `Sidebar-Setup-${{ steps.version.outputs.tag }}.exe` |

            Not sure which Mac you have? Apple menu → About This Mac: it shows either "Chip: Apple M…" or "Processor: Intel…".

            These builds aren't signed with an Apple or Microsoft certificate yet, so the first launch needs one extra step:

            - **Mac:** drag Sidebar to Applications and open it. When macOS says it can't verify Sidebar, click **Done**, then go to **System Settings → Privacy & Security**, scroll down and click **Open Anyway**. You only need to do this once.
            - **Windows:** if SmartScreen appears, click **More info → Run anyway**.
